<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Folio</title>
  <meta name="description" content="Pen-first study notes for medicine.">
  <meta name="theme-color" content="#4a3023" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17100c" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="library" class="library" hidden></div>

  <div id="editor" class="editor" hidden>
    <header class="ed-top">
      <button id="back" class="icon-btn" type="button" aria-label="Back to library"></button>
      <input id="noteTitle" class="title-input" type="text" placeholder="Untitled note" aria-label="Note title" maxlength="120">
      <span id="status" class="status" role="status"></span>
      <button id="zoomLabel" class="zoom-label" type="button" title="Reset zoom" hidden></button>
      <button id="undo" class="icon-btn" type="button" aria-label="Undo" title="Undo"></button>
      <button id="redo" class="icon-btn" type="button" aria-label="Redo" title="Redo"></button>
      <button id="pagesBtn" class="icon-btn" type="button" aria-label="Pages" title="Pages"></button>
      <button id="moreBtn" class="icon-btn" type="button" aria-label="Note options" title="Note options"></button>
    </header>
    <div id="dock" class="dock">
      <div id="dockGrip" class="dock-grip" title="Drag to move the toolbar" role="img" aria-label="Drag to move the toolbar"></div>
      <div id="tools" class="ed-tools" role="toolbar" aria-label="Writing tools"></div>
    </div>
    <main id="scroller" class="scroller">
      <div id="pages" class="pages"></div>
      <button id="addPage" class="add-page" type="button"></button>
    </main>
    <div id="pullHint" class="pull-hint" role="status" hidden>Keep holding for a new page</div>
    <div id="richBar" class="rich-bar" role="toolbar" aria-label="Text formatting" hidden></div>
    <div id="recBar" class="rec-bar" hidden></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="store.js"></script>
  <script src="ink.js"></script>
  <script src="ui.js"></script>
  <script src="docs.js"></script>
  <script src="sync.js"></script>
  <script src="editor.js"></script>
  <script src="library.js"></script>
  <script src="app.js"></script>
</body>
</html>
